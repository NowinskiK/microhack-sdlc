name: Deploy C# API and frontend

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-container-apps-${{ vars.AZURE_RESOURCE_GROUP }}
  cancel-in-progress: false

env:
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  LOCATION: ${{ vars.AZURE_LOCATION }}
  DEPLOYER_PRINCIPAL_ID: ${{ vars.AZURE_DEPLOYER_PRINCIPAL_ID }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  deploy:
    name: Build, deploy, and verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: ${{ vars.AZURE_GITHUB_ENVIRONMENT || 'demo' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Build and test C# API and frontend
        working-directory: src
        run: make build-cs build-frontend test-cs test-frontend

      - name: Compile Bicep
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in RESOURCE_GROUP LOCATION DEPLOYER_PRINCIPAL_ID AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            [[ -n "${!name}" ]] || { echo "Required GitHub secret or variable is missing: $name" >&2; exit 1; }
          done

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Configure Azure CLI extensions
        run: az config set extension.use_dynamic_install=yes_without_prompt

      - name: Check resource group and validate foundation
        run: |
          set -euo pipefail
          az group show --name "$RESOURCE_GROUP" --output none
          az deployment group validate \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters infra/main.parameters.json \
              deploymentStage=foundation location="$LOCATION" \
              deployerPrincipalId="$DEPLOYER_PRINCIPAL_ID"
          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters infra/main.parameters.json \
              deploymentStage=foundation location="$LOCATION" \
              deployerPrincipalId="$DEPLOYER_PRINCIPAL_ID"

      - name: Provision shared foundation
        run: |
          set -euo pipefail
          az deployment group create \
            --name foundation \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters infra/main.parameters.json \
              deploymentStage=foundation location="$LOCATION" \
              deployerPrincipalId="$DEPLOYER_PRINCIPAL_ID"
          ACR_NAME=$(az deployment group show \
            --name foundation \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.outputs.acrName.value \
            --output tsv)
          ACR_LOGIN_SERVER=$(az deployment group show \
            --name foundation \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.outputs.acrLoginServer.value \
            --output tsv)
          echo "acr_name=$ACR_NAME" >> "$GITHUB_OUTPUT"
          echo "acr_login_server=$ACR_LOGIN_SERVER" >> "$GITHUB_OUTPUT"
        id: foundation

      - name: Log in to ACR
        env:
          ACR_NAME: ${{ steps.foundation.outputs.acr_name }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if az acr login --name "$ACR_NAME"; then
              exit 0
            fi
            sleep 10
          done
          echo "Could not authenticate to ACR with the deployment identity." >&2
          exit 1

      - name: Build and push immutable images
        env:
          ACR_LOGIN_SERVER: ${{ steps.foundation.outputs.acr_login_server }}
        run: |
          set -euo pipefail
          API_IMAGE="$ACR_LOGIN_SERVER/api:$IMAGE_TAG"
          FRONTEND_IMAGE="$ACR_LOGIN_SERVER/frontend:$IMAGE_TAG"
          docker build --file api-cs/Dockerfile --tag "$API_IMAGE" .
          docker build --file frontend/Dockerfile --tag "$FRONTEND_IMAGE" frontend
          docker push "$API_IMAGE"
          docker push "$FRONTEND_IMAGE"
          echo "api_image=$API_IMAGE" >> "$GITHUB_OUTPUT"
          echo "frontend_image=$FRONTEND_IMAGE" >> "$GITHUB_OUTPUT"
        working-directory: src
        id: images

      - name: Validate and preview application deployment
        env:
          API_IMAGE: ${{ steps.images.outputs.api_image }}
          FRONTEND_IMAGE: ${{ steps.images.outputs.frontend_image }}
        run: |
          set -euo pipefail
          az deployment group validate \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters infra/main.parameters.json \
              deploymentStage=apps location="$LOCATION" \
              deployerPrincipalId="$DEPLOYER_PRINCIPAL_ID" \
              apiImage="$API_IMAGE" frontendImage="$FRONTEND_IMAGE"
          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters infra/main.parameters.json \
              deploymentStage=apps location="$LOCATION" \
              deployerPrincipalId="$DEPLOYER_PRINCIPAL_ID" \
              apiImage="$API_IMAGE" frontendImage="$FRONTEND_IMAGE"

      - name: Deploy application revisions
        env:
          API_IMAGE: ${{ steps.images.outputs.api_image }}
          FRONTEND_IMAGE: ${{ steps.images.outputs.frontend_image }}
        run: |
          set -euo pipefail
          az deployment group create \
            --name applications \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters infra/main.parameters.json \
              deploymentStage=apps location="$LOCATION" \
              deployerPrincipalId="$DEPLOYER_PRINCIPAL_ID" \
              apiImage="$API_IMAGE" frontendImage="$FRONTEND_IMAGE"
          FRONTEND_URL=$(az deployment group show \
            --name applications \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.outputs.frontendUrl.value \
            --output tsv)
          API_FQDN=$(az deployment group show \
            --name applications \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.outputs.apiFqdn.value \
            --output tsv)
          API_APP_NAME=$(az deployment group show \
            --name applications \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.outputs.apiAppName.value \
            --output tsv)
          FRONTEND_APP_NAME=$(az deployment group show \
            --name applications \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.outputs.frontendAppName.value \
            --output tsv)
          echo "frontend_url=$FRONTEND_URL" >> "$GITHUB_OUTPUT"
          echo "api_fqdn=$API_FQDN" >> "$GITHUB_OUTPUT"
          echo "api_app_name=$API_APP_NAME" >> "$GITHUB_OUTPUT"
          echo "frontend_app_name=$FRONTEND_APP_NAME" >> "$GITHUB_OUTPUT"
        id: applications

      - name: Verify latest revisions are ready
        env:
          API_APP_NAME: ${{ steps.applications.outputs.api_app_name }}
          FRONTEND_APP_NAME: ${{ steps.applications.outputs.frontend_app_name }}
          ACR_NAME: ${{ steps.foundation.outputs.acr_name }}
        run: |
          set -euo pipefail
          api_external=$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$API_APP_NAME" --query properties.configuration.ingress.external --output tsv)
          api_min=$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$API_APP_NAME" --query properties.template.scale.minReplicas --output tsv)
          api_max=$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$API_APP_NAME" --query properties.template.scale.maxReplicas --output tsv)
          api_registry_identity=$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$API_APP_NAME" --query 'properties.configuration.registries[0].identity' --output tsv)
          frontend_registry_identity=$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$FRONTEND_APP_NAME" --query 'properties.configuration.registries[0].identity' --output tsv)
          acr_admin_enabled=$(az acr show --name "$ACR_NAME" --query adminUserEnabled --output tsv)
          [[ "$api_external" == "false" ]] || { echo "API ingress must remain internal." >&2; exit 1; }
          [[ "$api_min" == "1" && "$api_max" == "1" ]] || { echo "The API must use exactly one replica." >&2; exit 1; }
          [[ -n "$api_registry_identity" && -n "$frontend_registry_identity" ]] || { echo "Both apps must pull images with managed identities." >&2; exit 1; }
          [[ "$acr_admin_enabled" == "false" ]] || { echo "ACR admin access must remain disabled." >&2; exit 1; }
          for attempt in $(seq 1 60); do
            api_latest=$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$API_APP_NAME" --query properties.latestRevisionName --output tsv)
            api_ready=$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$API_APP_NAME" --query properties.latestReadyRevisionName --output tsv)
            frontend_latest=$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$FRONTEND_APP_NAME" --query properties.latestRevisionName --output tsv)
            frontend_ready=$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$FRONTEND_APP_NAME" --query properties.latestReadyRevisionName --output tsv)
            if [[ -n "$api_latest" && "$api_latest" == "$api_ready" && -n "$frontend_latest" && "$frontend_latest" == "$frontend_ready" ]]; then
              exit 0
            fi
            sleep 10
          done
          echo "The latest API and frontend revisions did not both become ready." >&2
          az containerapp revision list --resource-group "$RESOURCE_GROUP" --name "$API_APP_NAME" --output table || true
          az containerapp revision list --resource-group "$RESOURCE_GROUP" --name "$FRONTEND_APP_NAME" --output table || true
          exit 1

      - name: Run bounded application smoke tests
        env:
          FRONTEND_URL: ${{ steps.applications.outputs.frontend_url }}
          API_FQDN: ${{ steps.applications.outputs.api_fqdn }}
        run: |
          set -euo pipefail
          [[ -n "$API_FQDN" ]] || { echo "Internal API FQDN was not returned by Bicep." >&2; exit 1; }
          if curl --silent --fail --max-time 10 "https://$API_FQDN/health/live"; then
            echo "The API ingress is reachable directly from outside the Container Apps environment." >&2
            exit 1
          fi
          curl --fail --silent --show-error --retry 30 --retry-delay 10 --retry-connrefused --retry-all-errors --max-time 15 "$FRONTEND_URL/" | grep -q '<title>OctoCAT Supply</title>'
          curl --fail --silent --show-error "$FRONTEND_URL/products" | grep -q '<title>OctoCAT Supply</title>'

          products=$(curl --fail --silent --show-error "$FRONTEND_URL/api/products")
          printf '%s' "$products" | jq -e 'type == "array" and length > 0' >/dev/null
          branch_id=$(curl --fail --silent --show-error "$FRONTEND_URL/api/branches" | jq -er '.[0].branchId')
          order_name="deployment-smoke-${GITHUB_SHA:0:12}"
          order=$(curl --fail --silent --show-error \
            --header 'Content-Type: application/json' \
            --data "{\"branchId\":$branch_id,\"orderDate\":\"$(date -u +%F)\",\"name\":\"$order_name\",\"status\":\"pending\"}" \
            "$FRONTEND_URL/api/orders")
          order_id=$(printf '%s' "$order" | jq -er '.orderId')
          history=$(curl --fail --silent --show-error "$FRONTEND_URL/api/orders?branchId=$branch_id")
          printf '%s' "$history" | jq -e --argjson orderId "$order_id" 'any(.[]; .orderId == $orderId)' >/dev/null

          error_status=$(curl --silent --show-error --output "$RUNNER_TEMP/api-error.json" --write-out '%{http_code}' "$FRONTEND_URL/api/products/2147483647")
          [[ "$error_status" == "404" ]]
          jq -e '.error.code == "NOT_FOUND"' "$RUNNER_TEMP/api-error.json" >/dev/null

      - name: Publish deployment summary
        env:
          FRONTEND_URL: ${{ steps.applications.outputs.frontend_url }}
          API_IMAGE: ${{ steps.images.outputs.api_image }}
          FRONTEND_IMAGE: ${{ steps.images.outputs.frontend_image }}
        run: |
          {
            echo "## Azure Container Apps deployment"
            echo
            echo "- Frontend: $FRONTEND_URL"
            echo "- API image: \`$API_IMAGE\`"
            echo "- Frontend image: \`$FRONTEND_IMAGE\`"
            echo "- API access: internal ingress only"
            echo "- SQLite: local disposable container storage"
          } >> "$GITHUB_STEP_SUMMARY"
